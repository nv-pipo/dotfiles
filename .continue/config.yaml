name: Local Config
version: 1.0.0
schema: v1
models:
  - name: Qwen2.5-Coder-7B-Base (Ollama)
    provider: ollama
    model: qwen2.5-coder:7b-base
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 8192
      maxTokens: 256
  - name: Ornith-1.5-35B (Ollama)
    provider: ollama
    model: ornith-1.5:35b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 32768
      maxTokens: 4096
  - name: "Z.ai: GLM 5.3 flash"
    provider: openrouter
    model: z-ai/glm-5.3-flash
    apiKey: ${{ secrets.OPENROUTER_API_KEY }}
    defaultCompletionOptions:
      maxTokens: 943718
    capabilities:
      - tool_use
  - name: "Z.ai: GLM 5.3"
    provider: openrouter
    model: z-ai/glm-5.3
    apiKey: ${{ secrets.OPENROUTER_API_KEY }}
    defaultCompletionOptions:
      maxTokens: 943718
    capabilities:
      - tool_use
context:
  - provider: search
    params:
      maxResults: 100
  - provider: web
    params:
      n: 5
