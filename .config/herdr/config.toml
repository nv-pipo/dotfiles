onboarding = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[theme]
name = "tokyo-night"

[advanced]
scrollback_limit_bytes = 10485760

[experimental]
allow_nested = true

[keys]
prefix = "ctrl+t"
new_tab = ["prefix+c", "super+t"]
previous_tab = ["prefix+p", "alt+m", "super+shift+right"]
next_tab = ["prefix+n", "alt+i", "super+shift+left"]
new_workspace = ["prefix+shift+n", "super+w"]
previous_workspace = "alt+e"
next_workspace = "alt+n"
previous_agent = "ctrl+alt+e"
next_agent = "ctrl+alt+n"
focus_pane_left = ["prefix+h", "ctrl+alt+m"]
focus_pane_down = ["prefix+j", "ctrl+alt+n"]
focus_pane_up = ["prefix+k", "ctrl+alt+e"]
focus_pane_right = ["prefix+l", "ctrl+alt+i"]
